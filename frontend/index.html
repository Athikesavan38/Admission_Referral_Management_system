<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admission Referral Portal — Manage and track student admission referrals with ease." />
    <meta name="theme-color" content="#1e2a78" />

    <!-- Preconnect to Google Fonts for faster font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Admission Referral Portal</title>

    <!-- Inline critical CSS: prevent flash of unstyled content + smooth scroll -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
      #root { min-height: 100vh; }

      /* Page skeleton loader shown before JS hydrates */
      #app-loader {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #f0f2f9;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loader.hidden { opacity: 0; pointer-events: none; }
      .loader-ring {
        width: 40px; height: 40px;
        border: 4px solid #e0e7ff;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Prevent dark flash on initial load — light is default -->
    <script>
      (function() {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="app-loader" aria-hidden="true">
      <div class="loader-ring"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
